<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menü</title>
  <style>
    :root {
      --bg: #faf8f5;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: rgba(0,0,0,.08);
      --accent: #2c2c2c;
      --price-w: 2.75rem;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.4; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
    .toolbar {
      position: sticky; top: 0; z-index: 2;
      background: linear-gradient(var(--bg) 70%, transparent);
      padding: 0.5rem 0 1rem; text-align: center;
    }
    .toolbar button {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 0.45rem 1rem; font-size: 0.85rem; cursor: pointer; font-weight: 600;
    }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.35rem; letter-spacing: 0.12em; margin: 0; font-weight: 700; }
    header p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }
    section { margin-bottom: 2rem; }
    .section-head { border-bottom: 2px solid var(--accent); padding-bottom: 0.4rem; margin-bottom: 0.5rem; }
    .section-head h2 { margin: 0; font-size: 0.95rem; letter-spacing: 0.08em; }
    .section-head .sub { margin: 0.2rem 0 0; font-size: 0.78rem; color: var(--muted); }
    .grid-head, .item-row {
      display: grid;
      grid-template-columns: 1fr repeat(3, var(--price-w));
      gap: 0.35rem 0.65rem;
      align-items: start;
    }
    .grid-head.cols-2, .item-row.cols-2 { grid-template-columns: 1fr repeat(2, var(--price-w)); }
    .grid-head {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);
      text-transform: uppercase; padding: 0.4rem 0 0.35rem; border-bottom: 1px solid var(--line); margin-bottom: 0.15rem;
    }
    .grid-head span { text-align: center; }
    .item-row { padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
    .item-row:last-child { border-bottom: none; }
    .name { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.03em; line-height: 1.3; }
    .desc { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400; margin-top: 0.15rem; }
    .cell { text-align: center; font-size: 0.78rem; font-weight: 700; padding-top: 0.05rem; }
    .cell.empty { color: #bbb; font-weight: 500; }
    @media print { .toolbar { display: none; } body { background: #fff; } .wrap { max-width: none; padding: 0.5in; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button type="button" onclick="window.print()">PDF olarak kaydet / Yazdır</button>
    </div>
    <header>
      <h1>MENÜ</h1>
      <p>Fiyatlar Türk Lirası (₺)</p>
    </header>
    <div id="menu"></div>
  </div>
  <script>
    const fmt = n => (n == null ? null : n + '₺');
    const cell = v => {
      if (v) return `<span class="cell">${v}</span>`;
      return `<span class="cell empty">—</span>`;
    };

    const sections = [
      {
        title: 'SICAK KAHVELER', sub: 'Hot Coffees',
        colCount: 2, headLabels: ['Single', 'Double'],
        items: [
          { name: 'ESPRESSO', p: [120, 140] },
          { name: 'ESPRESSO MACCHIATO', p: [140, 160] },
          { name: 'TÜRK KAHVESİ', p: [100, 130] },
          { name: 'FİNCAN ÇAY', p: [60, null] }
        ]
      },
      {
        title: 'SICAK KAHVELER', sub: 'Bardak',
        colCount: 3, headLabels: ['S', 'M', 'L'],
        items: [
          { name: 'FİLTRE KAHVE', p: [140, 150, 160] },
          { name: 'AMERICANO', p: [150, 160, 170] },
          { name: 'CORTADO', p: [null, 170, null] },
          { name: 'CAFFE LATTE', p: [160, 170, 180] },
          { name: 'CAPPUCCINO', p: [160, 170, 180] },
          { name: 'FLAT WHITE', p: [170, 180, 190] },
          { name: 'CARAMEL MACCHIATO', p: [180, 190, 200] },
          { name: 'WHITE CHOCOLATE MOCHA', p: [180, 190, 200] },
          { name: 'TOFFENUT LATTE', p: [180, 190, 200] },
          { name: 'VANILLA LATTE', p: [180, 190, 200] },
          { name: 'HAZELNUT LATTE', p: [180, 190, 200] }
        ]
      },
      {
        title: 'İMZA REÇELER', sub: 'Signature Recipes',
        colCount: 3, headLabels: ['S', 'M', 'L'],
        items: [
          { name: 'CHOCOLATE COOKIE LATTE', desc: 'Çikolata Kurabiye', p: [180, 190, 200] },
          { name: 'WHITE BERRY LATTE', desc: 'Beyaz Çikolata Böğürtlen', p: [180, 190, 200] },
          { name: 'CAPADOCIA', desc: 'Tuzlu Karamel Fındık', p: [180, 190, 200] },
          { name: 'STRAWBERRY LATTE', desc: 'Tuzlu Karamel Fındık', p: [180, 190, 200] },
          { name: 'SPANISH LATTE', p: [180, 190, 200] }
        ]
      },
      {
        title: 'SOĞUK KAHVELER', sub: 'Cold Coffees · S = 355 ml, L = 473 ml',
        colCount: 3, headLabels: ['S', 'M', 'L'],
        items: [
          { name: 'ICED LATTE', p: [170, null, 190] },
          { name: 'ICED AMERICANO', p: [160, null, 180] },
          { name: 'ICED FILTER', p: [140, null, 160] },
          { name: 'ICED WHITE CHOCOLATE MOCHA', p: [180, null, 200] },
          { name: 'ICED CARAMEL LATTE', desc: 'Karamel aromalı soğuk kahve', p: [180, null, 200] },
          { name: 'ICED TARO LATTE', desc: 'Taro aromalı soğuk kahve', p: [180, null, 200] },
          { name: 'ICED WHITE BERRY LATTE', desc: 'Beyaz çikolata ve böğürtlen', p: [180, null, 200] },
          { name: 'ICED STRAWBERRY LATTE', desc: 'Çilek aromalı soğuk kahve', p: [180, null, 200] },
          { name: 'ESPRESSO SHOT', desc: 'Ekstra', p: [null, 50, null] },
          { name: 'BİTKİSEL SÜT', desc: 'Ekstra', p: [null, 50, null] }
        ]
      },
      {
        title: 'SUMMER SPECIALS', sub: 'Yaza özel · S = 355 ml, L = 473 ml',
        colCount: 3, headLabels: ['S', 'M', 'L'],
        items: [
          { name: 'ORANGE MANGO', desc: 'Portakal ve mango', p: [200, null, 220] },
          { name: 'SORREL COCTAIL', desc: 'Kuzu kulağı · Vegan', p: [200, null, 220] },
          { name: 'BERRY HIBISCUS', desc: 'Böğürtlen ve hibiscus', p: [200, null, 220] },
          { name: 'COOL LIME', desc: 'Lim ve nane', p: [200, null, 220] }
        ]
      },
      {
        title: 'MATCHA SERIES', sub: 'İmza matcha reçeteler',
        colCount: 3, headLabels: ['S', 'M', 'L'],
        items: [
          { name: 'COCONUT CLOUD MATCHA LATTE', desc: 'Hindistan cevizi & cloud matcha', p: [null, 280, null] },
          { name: 'STRAWBERRY MATCHA LATTE', desc: 'Çilek aromalı buzlu matcha', p: [null, 280, null] },
          { name: 'MANGO MATCHA LATTE', desc: 'Mango aromalı buzlu matcha', p: [null, 280, null] },
          { name: 'TARO OAT MATCHA LATTE', desc: 'Taro & yulaf sütü', p: [null, 280, null] },
          { name: 'BLUE MATCHA LATTE', desc: 'Spirulina blue matcha', p: [null, 280, null] }
        ]
      },
      {
        title: 'MİLKSHAKE', colCount: 3, headLabels: ['S', 'M', 'L'],
        items: [
          { name: 'ÇİKOLATALI MİLKSHAKE', p: [null, 250, null] },
          { name: 'MUZLU MİLKSHAKE', p: [null, 250, null] },
          { name: 'ÇİLEKLİ MİLKSHAKE', p: [null, 250, null] }
        ]
      },
      {
        title: 'FROZEN', colCount: 3, headLabels: ['S', 'M', 'L'],
        items: [
          { name: 'MANGO FROZEN', p: [null, 250, null] },
          { name: 'RED BERRY FROZEN', p: [null, 250, null] }
        ]
      }
    ];

    function priceCells(it, colCount) {
      const p = it.p;
      if (colCount === 2) return [cell(fmt(p[0])), cell(fmt(p[1]))].join('');
      return [cell(fmt(p[0])), cell(fmt(p[1])), cell(fmt(p[2]))].join('');
    }

    function renderSection(sec) {
      const extra = sec.colCount === 2 ? ' cols-2' : '';
      const heads = sec.headLabels.map(l => `<span>${l}</span>`).join('');
      const rows = sec.items.map(it => {
        const desc = it.desc ? `<span class="desc">${it.desc}</span>` : '';
        return `<div class="item-row${extra}">
          <div><span class="name">${it.name}</span>${desc}</div>
          ${priceCells(it, sec.colCount)}
        </div>`;
      }).join('');

      const sub = sec.sub ? `<p class="sub">${sec.sub}</p>` : '';
      return `<section>
        <div class="section-head"><h2>${sec.title}</h2>${sub}</div>
        <div class="grid-head${extra}"><span></span>${heads}</div>
        ${rows}
      </section>`;
    }

    document.getElementById('menu').innerHTML = sections.map(renderSection).join('');
  </script>
</body>
</html>
